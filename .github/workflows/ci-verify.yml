name: CI Verify (dubbo-go-samples)

on:
  push:
    branches: ["ci/gha-verify"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Clone upstream source
        run: git clone --depth=1 --branch main https://github.com/apache/dubbo-go-samples.git source
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache: true
          cache-dependency-path: source/go.sum
      - name: Build
        working-directory: source
        run: go build -v ./...
